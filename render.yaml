# Render Blueprint: Dashboard > New > Blueprint, then pick this repo.
services:
  - type: web
    name: caire-cover
    runtime: python
    plan: starter            # a persistent disk needs a paid instance
    region: frankfurt        # closest Render region to Ghana
    branch: main
    buildCommand: pip install -r requirements.txt
    # One worker: SQLite and the login lockout counter live in one process.
    startCommand: gunicorn "app:create_app()" --workers 1 --threads 8 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: caire-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CAIRE_DB
        value: /var/data/caire.db
      - key: CAIRE_SIMULATE
        value: "1"           # demo mode; set to 0 once real SMS and mobile money are connected
      - key: CAIRE_SECURE_COOKIES
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # Render asks for this when you create the Blueprint
