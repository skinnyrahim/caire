# Render Blueprint: Dashboard > New > Blueprint, then pick this repo.
# Changes to this file are applied from the Blueprint's page ("Manual sync" if
# auto-sync is off).
services:
  - type: web
    name: caire-cover
    runtime: python
    plan: starter
    region: frankfurt        # closest Render region to Ghana; must match the database
    branch: main
    buildCommand: pip install -r requirements.txt
    # One worker: the login lockout counter lives in one process.
    startCommand: gunicorn "app:create_app()" --workers 1 --threads 8 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    # Holds the old SQLite file (/var/data/caire.db). Once its data has been
    # copied to Postgres (see README), this disk block can be deleted.
    disk:
      name: caire-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: caire-db
          property: connectionString   # private network address
      - key: CAIRE_SIMULATE
        value: "1"           # 1 = channels without a key are simulated, plus demo tools; 0 = never simulate
      - key: CAIRE_SECURE_COOKIES
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # Render asks for this when you create the Blueprint
      # Real mobile money and SMS: add these in the service's Environment tab (see README).
      #   PAYSTACK_SECRET_KEY   sk_test_... to try, sk_live_... for real money
      #   ARKESEL_API_KEY       from Arkesel > SMS API
      #   ARKESEL_SENDER        approved sender ID, max 11 characters (default CAIRE)
      #   PAYSTACK_EMAIL_DOMAIN optional; members' Paystack emails are <member-id>@<domain>

databases:
  - name: caire-db
    databaseName: caire
    user: caire
    plan: basic-256mb        # paid: daily backups, no expiry (free databases are deleted after 30 days)
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []          # no access from the internet; only Render services can connect
